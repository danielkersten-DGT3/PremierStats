{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <h3>Edit Player</h3>

    <form method="POST">

        <div class="form-group">
            <label>Player Name</label>
            <input type="text"
                   name="name"
                   value="{{ player.name }}"
                   required>
        </div>

        <div class="form-group">
            <label>Goals</label>
            <input type="number"
                   name="goals"
                   value="{{ player.Goals }}"
                   required>
        </div>

        <div class="form-group">
            <label>Assists</label>
            <input type="number"
                   name="assists"
                   value="{{ player.Assists }}"
                   required>
        </div>

        <div class="form-group">
            <label>Saves</label>
            <input type="number"
                   name="saves"
                   value="{{ player.Saves }}"
                   required>
        </div>

        <div class="form-group">
            <label>Start Date</label>
            <input type="date"
                   name="start_date"
                   value="{{ player.PlayerStartDate }}"
                   required>
        </div>

        <div class="form-group">
            <label>End Date</label>
            <input type="date"
                   name="end_date"
                   value="{{ player.PlayerEndDate }}"
                   required>
        </div>

        <div class="form-group">
            <label>Club</label>

            <select name="club" required>
                {% for club in clubs %}
                    <option value="{{ club.Clubid }}"
                        {% if club in player.clubs %}selected{% endif %}>
                        {{ club.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="add-player-button">
            Save Changes
        </button>

    </form>

</div>

{% endblock %}
