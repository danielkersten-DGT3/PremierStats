{% extends "layout.html" %}

{% block content %}

<h3>Managers</h3>
<!--Search Bar-->
<form method="GET" action="{{ url_for('managers') }}" class="search-form">

    <input
        type="text"
        name="search"
        placeholder="Search for a Manager..."
        value="{{ search or '' }}"
    >

    <button type="submit">Search</button>

</form>
<table>
    <thead>
        <tr>
            <th>Manager</th>
            <th>Club</th>
        </tr>
    </thead>

    <tbody>
        {% for manager in managers %}
        <tr>
            <td>
                <!--Links to Manager-->
                <a href="{{ url_for('manager', Managerid=manager.Managerid) }}">
                    {{ manager.Name }}
                </a>
            </td>

            <td>
                {% if manager.clubs %}
                <!--Links to Club-->
                    {% for club in manager.clubs %}
                        <a href="{{ url_for('club', Clubid=club.Clubid) }}">
                            {{ club.name }}
                        </a>
                    {% endfor %}
                {% else %}
                    No Club
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
