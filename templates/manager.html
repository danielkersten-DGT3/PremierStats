{% extends "layout.html" %}

{% block content %}

<h3>{{ manager.Name }}</h3>

<h2>Club</h2>
<!--Manager Info-->
{% if manager.clubs %}
    {% for club in manager.clubs %}
        <p>{{ club.name }}</p>
        <p>Wins: {{ club.Wins }}</p>
        <p>Losses: {{ club.Losses }}</p>
    {% endfor %}
{% else %}
    <p>No club assigned.</p>
{% endif %}

<a href="{{ url_for('managers') }}">Back to Managers</a>

{% endblock %}
